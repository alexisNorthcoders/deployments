# Pages for the LAN only (http://raspberrypi.local/...). Include it only in the
# port-80 default_server block, never in the public server block.

location = /monitor-canvas { return 301 /monitor-canvas/; }
location = /monitor-canvas/ { rewrite ^ /monitor-canvas/index.html last; }

location = /monitor-canvas/index.html {
    alias /home/alexis/Projects/monitor-canvas/index.html;
    add_header Cache-Control "no-cache" always;
}

location = /monitor-canvas/main.js {
    alias /home/alexis/Projects/monitor-canvas/main.js;
}

location /monitor-canvas/ { return 404; }

# --- reddit-bot book dashboard ----------------------------------------------
# Static export from `npm run dashboard_export` (nightly via agent-runner).
# Only the page and its snapshot are served; no auth, so LAN addresses only.

location = /reddit-dashboard { return 301 /reddit-dashboard/; }
location = /reddit-dashboard/ { rewrite ^ /reddit-dashboard/index.html last; }

location = /reddit-dashboard/index.html {
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    deny all;
    alias /home/alexis/Projects/reddit-bot/reports/dashboard/index.html;
    add_header Cache-Control "no-cache" always;
}

location = /reddit-dashboard/snapshot.json {
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    deny all;
    alias /home/alexis/Projects/reddit-bot/reports/dashboard/snapshot.json;
    add_header Cache-Control "no-cache" always;
}

location /reddit-dashboard/ { return 404; }

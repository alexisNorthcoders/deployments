# Chess Trainer (chess-trainer, PM2, port 3100) at /chess-trainer/. The app
# serves itself under that path (BASE_PATH=/chess-trainer in its
# ecosystem.config.cjs), so the path is passed through unchanged.
#
# Included in the public alexisraspberry.duckdns.org server block and in the
# LAN port-80 block. The app has no auth of its own: LAN addresses get in
# directly, anyone else needs the login in /etc/nginx/chess-trainer.htpasswd
# (see README.md).

location = /chess-trainer { return 301 /chess-trainer/; }

location /chess-trainer/ {
    satisfy any;
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    deny all;
    auth_basic "Chess Trainer";
    auth_basic_user_file /etc/nginx/chess-trainer.htpasswd;

    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
}
